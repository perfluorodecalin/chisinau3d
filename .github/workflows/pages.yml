name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate-and-package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install development dependencies
        run: npm ci
      - name: Run quality checks
        run: npm test
      - name: Fingerprint saved city inputs
        id: world-key
        run: echo "hash=$(node scripts/world-inputs.mjs)" >> "$GITHUB_OUTPUT"
      - name: Restore compiled city
        uses: actions/cache@v4
        with:
          path: dist/world
          key: world-${{ runner.os }}-node22-${{ steps.world-key.outputs.hash }}
      - name: Compile offline city chunks
        run: npm run build
      - name: Verify compiled city
        run: npm run verify:world
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      # dist/ is authored source. Publish it intact without a bundler or Jekyll.
      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: validate-and-package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
