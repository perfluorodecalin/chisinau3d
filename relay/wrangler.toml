name = "chisinau3d-rooms"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = true
keep_vars = false

[observability]
enabled = false

[vars]
PAGES_ORIGIN = "https://perfluorodecalin.github.io"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[ratelimits]]
name = "UPGRADE_LIMIT"
namespace_id = "1001"
simple = { limit = 60, period = 60 }
